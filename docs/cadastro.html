<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colégio CSEI — Cadastro de Usuário</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body class="cadastro">

    <header>
        <a href="index.html"><h1>Colégio CSEI</h1></a>
        <nav>
            <span class="header-pagina">Cadastro de Usuário</span>
        </nav>
    </header>

    <main class="cadastro-main">
        <div class="form-container">
            <h2>Criar Conta</h2>
            <p class="form-subtitulo">Preencha os campos abaixo para criar seu acesso ao sistema do Colégio CSEI.</p>

            <form id="formCadastro">

                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <div class="form-grupo">
                        <label for="nomeCompleto">Nome completo *</label>
                        <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Seu nome completo" required>
                    </div>

                    <div class="form-linha">
                        <div class="form-grupo">
                            <label for="cpf">CPF *</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                        </div>
                        <div class="form-grupo">
                            <label for="nascimento">Data de nascimento *</label>
                            <input type="date" id="nascimento" name="nascimento" required>
                        </div>
                    </div>

                    <div class="form-linha">
                        <div class="form-grupo">
                            <label for="telefone">Telefone / WhatsApp *</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                        </div>
                        <div class="form-grupo">
                            <label for="perfil">Perfil *</label>
                            <select id="perfil" name="perfil" required>
                                <option value="">Selecione</option>
                                <option value="responsavel">Responsável</option>
                                <option value="professor">Professor</option>
                                <option value="funcionario">Funcionário</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Dados de Acesso</legend>

                    <div class="form-grupo">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
                    </div>

                    <div class="form-linha">
                        <div class="form-grupo">
                            <label for="senha">Senha *</label>
                            <div class="input-senha-wrapper">
                                <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" minlength="8" required>
                                <button type="button" class="btn-toggle-senha" onclick="toggleSenha('senha', this)" tabindex="-1" aria-label="Mostrar senha">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-grupo">
                            <label for="confirmarSenha">Confirmar senha *</label>
                            <div class="input-senha-wrapper">
                                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" minlength="8" required>
                                <button type="button" class="btn-toggle-senha" onclick="toggleSenha('confirmarSenha', this)" tabindex="-1" aria-label="Mostrar senha">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                            <span class="msg-erro" id="erroSenha"></span>
                        </div>
                    </div>

                    <div class="forca-senha" id="forcaSenha">
                        <span class="forca-label">Força da senha:</span>
                        <div class="forca-barras">
                            <div class="barra" id="b1"></div>
                            <div class="barra" id="b2"></div>
                            <div class="barra" id="b3"></div>
                            <div class="barra" id="b4"></div>
                        </div>
                        <span class="forca-texto" id="forcaTexto"></span>
                    </div>

                </fieldset>

                <div class="form-aceite">
                    <input type="checkbox" id="aceite" name="aceite" required>
                    <label for="aceite">Declaro que as informações fornecidas são verdadeiras e concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> do Colégio CSEI.</label>
                </div>

                <button type="submit" class="btn-enviar">Criar conta</button>

                <p class="link-login">Já tem uma conta? <a href="login.html">Faça login</a></p>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Colégio CSEI — Salvador, BA</p>
    </footer>
    
    <script src="js/cadastro.js "></script>

</body>
</html>
