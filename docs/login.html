<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Colégio CSEI</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="bodylogin">

    <header>
        <a href="index.html">
            <h1>Colégio CSEI</h1>
        </a>
        <nav>
            <a href="#">Matrícula</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="login-main">
        <section class="login-left">
            <div class="login-base">
                <h2>Login</h2>
                <form>
                    <div class="campo">
                        <label for="email">EMAIL:</label>
                        <input type="text" id="email" name="username" placeholder="****" required>
                    </div>
                    <div class="campo">
                        <label for="senha">SENHA:</label>
                        <input type="password" id="senha" name="password" placeholder="****" required>
                    </div>
                    <a href="#" class="esqueci">Esqueci a Senha</a>
                    <input type="submit" value="ENTRAR">
                </form>
                <a href="#" class="cadastro">Cadastre-se</a>
            </div>

        </section>

        <section class="login-right"></section>
    </main>

    <footer>
        <p>&copy; 2025 Colégio CSEI — Salvador, BA</p>
    </footer>

</body>

</html>
