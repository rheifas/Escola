<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Professor</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pag_professor.css">
</head>

<body class="pag_professor">

    <header>
        <a href="index.html">
            <h1>Colégio CSEI</h1>
        </a>
        <nav>
            <span class="header-pagina" id="headerNome">Página do Professor</span>
        </nav>
    </header>

    <div class="professor-wrapper">
        <aside class="sidebar" id="sidebar">
            <button class="toggle-btn" id="toggleBtn" aria-label="Minimizar menu">&#8249;</button>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-target="informacoes">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">Informações</span>
                </a>
                <a href="#" class="nav-item" data-target="turmas">
                    <span class="nav-icon">📚</span>
                    <span class="nav-label">Minhas Turmas</span>
                </a>
            </nav>
        </aside>

        <main class="professor-content">

            <!-- INFORMAÇÕES -->
            <section class="pagina active" id="informacoes">
                <h2>Informações</h2>
                <div id="dadosProfessor" class="info-card"></div>
            </section>

            <!-- TURMAS -->
            <section class="pagina" id="turmas">
                <h2>Minhas Turmas</h2>
                <p class="subtitulo">Clique em uma turma para ver e editar os boletins dos alunos.</p>
                <div id="listaTurmas" class="lista-cards"></div>
                <div id="painelBoletins" class="painel-boletins" style="display:none;"></div>
            </section>

        </main>
    </div>

    <footer>
        <p>&copy; 2026 Colégio CSEI — Salvador, BA</p>
    </footer>

    <script src="js/pag_professor.js"></script>
</body>

</html>
