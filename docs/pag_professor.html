<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Professor</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pag_professor.css">
</head>

<body class="pag_professor">

    <header>
        <a href="index.html"><h1>Colégio CSEI</h1></a>
        <nav>
            <span class="header-pagina">Página do Professor</span>
        </nav>
    </header>

    <div class="aluno-wrapper">

        <aside class="sidebar" id="sidebar">
            <button class="toggle-btn" id="toggleBtn" aria-label="Minimizar menu">&#8249;</button>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-target="informacoes">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">Informações</span>
                </a>
                <a href="#" class="nav-item" data-target="disciplinas">
                    <span class="nav-icon">📚</span>
                    <span class="nav-label">Disciplinas</span>
                </a>
                <a href="#" class="nav-item" data-target="turmas">
                    <span class="nav-icon">🏫</span>
                    <span class="nav-label">Turmas</span>
                </a>
            </nav>
        </aside>

        <main class="aluno-content">

            <!-- BUSCA -->
            <div class="busca-professor" id="buscaProfessorBox">
                <h2>Identificação</h2>
                <p>Digite seu nome para carregar suas informações.</p>
                <div class="busca-bar">
                    <input type="text" id="inputBuscaProfessor" placeholder="Seu nome...">
                    <button onclick="buscarProfessor()">Buscar</button>
                </div>
                <div id="resultadoBusca"></div>
            </div>

            <!-- INFORMAÇÕES -->
            <section class="pagina" id="informacoes">
                <h2>Informações</h2>
                <div id="dadosProfessor" class="info-card"></div>
            </section>

            <!-- DISCIPLINAS -->
            <section class="pagina" id="disciplinas">
                <h2>Minhas Disciplinas</h2>
                <div id="listaDisciplinasProfessor" class="lista-cards"></div>
            </section>

            <!-- TURMAS -->
            <section class="pagina" id="turmas">
                <h2>Minhas Turmas</h2>
                <div id="listaTurmasProfessor" class="lista-cards"></div>
            </section>

        </main>
    </div>

    <footer>
        <p>&copy; 2025 Colégio CSEI — Salvador, BA</p>
    </footer>

    <script src="js/pag_professor.js"></script>
</body>
</html>
